<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 GitHub Pages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 40px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: #eef2ff;
      border-radius: 50%;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 28px;
      color: #111827;
    }

    h1 span {
      color: #4f46e5;
    }

    p {
      margin-bottom: 14px;
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
    }

    .time {
      margin-top: 18px;
      font-size: 14px;
      color: #6b7280;
    }

    .btn {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: #4f46e5;
      border-radius: 10px;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">🚀</div>

    <h1>你好，我是 <span>你的名字</span></h1>

    <p>欢迎来到我的 GitHub Pages 站点。</p>
    <p>这是一个可以直接使用的静态页面样例。</p>

    <a class="btn" href="https://github.com/你的用户名" target="_blank" rel="noopener">
      访问我的 GitHub
    </a>

    <p class="time" id="time"></p>
  </main>

  <script>
    const timeElement = document.getElementById("time");
    const now = new Date();

    timeElement.textContent =
      "页面加载时间：" +
      now.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
  </script>
</body>
</html>
